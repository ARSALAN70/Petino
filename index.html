<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="پتینو؛ فروشگاه آنلاین غذای سگ و گربه، تشویقی و لوازم نگهداری حیوانات خانگی.">
  <title>پتینو | فروشگاه غذای سگ و گربه</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange: #f47b35;
      --orange-dark: #d85f20;
      --green: #315b43;
      --green-light: #e8f0e7;
      --cream: #fffaf2;
      --white: #ffffff;
      --text: #292d29;
      --muted: #777c75;
      --border: #eee8dd;
      --shadow: 0 12px 35px rgba(46, 55, 43, .08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 95px;
    }

    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.9;
    }

    button, input, select {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1160px, 92%);
      margin-inline: auto;
    }

    .announcement {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 7px 12px;
      font-size: 12px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 250, 242, .96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 27px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--orange);
      color: white;
      font-size: 25px;
      transform: rotate(-5deg);
    }

    .logo small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 2px;
      line-height: 1;
      text-align: center;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--orange-dark);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-button {
      border: 0;
      background: var(--green);
      color: white;
      border-radius: 14px;
      padding: 10px 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .cart-count {
      display: inline-grid;
      place-items: center;
      min-width: 23px;
      height: 23px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--orange);
      font-size: 12px;
    }

    .hero {
      padding: 52px 0 40px;
    }

    .hero-card {
      min-height: 440px;
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      background: #f9e9d7;
    }

    .hero-content {
      padding: 45px;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-block;
      background: white;
      color: var(--green);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(29px, 4vw, 48px);
      line-height: 1.55;
      color: var(--green);
      font-weight: 900;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: var(--orange-dark);
    }

    .hero p {
      max-width: 440px;
      color: #62665e;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .button-primary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: white;
      padding: 13px 23px;
      border: 0;
      border-radius: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .button-primary:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    .button-outline {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 12px 20px;
      border: 1px solid #d9c8b5;
      border-radius: 14px;
      font-weight: 700;
      margin-right: 8px;
    }

    .hero-image {
      height: 100%;
      min-height: 380px;
      background:
        linear-gradient(90deg, rgba(249,233,215,0), rgba(249,233,215,.04)),
        url("https://images.unsplash.com/photo-1450778869180-41d0601e046e?auto=format&fit=crop&w=1100&q=85")
        center / cover no-repeat;
      border-radius: 0 180px 0 0;
    }

    .trust-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .trust-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--green-light);
      font-size: 23px;
    }

    .trust-item strong {
      display: block;
      font-size: 13px;
    }

    .trust-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    section {
      padding: 48px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 900;
      color: var(--green);
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .category-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      text-align: center;
      transition: .25s;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .category-card img {
      width: 100%;
      height: 155px;
      object-fit: cover;
    }

    .category-card h3 {
      font-size: 16px;
      padding: 12px 8px 0;
      color: var(--green);
    }

    .category-card p {
      font-size: 12px;
      color: var(--muted);
      padding: 0 8px 16px;
    }

    .shop-section {
      background: #f5f3eb;
    }

    .shop-toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 15px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--orange);
    }

    .filter-button {
      padding: 10px 16px;
      border: 1px solid var(--border);
      background: white;
      color: var(--green);
      border-radius: 13px;
      font-weight: 700;
    }

    .filter-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border: 1px solid #eee9df;
      border-radius: 21px;
      overflow: hidden;
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 205px;
      position: relative;
      background: #f5f0e7;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    .product-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--green);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
    }

    .product-info {
      padding: 16px;
    }

    .product-category {
      font-size: 11px;
      color: var(--orange-dark);
      font-weight: 800;
    }

    .product-info h3 {
      font-size: 15px;
      line-height: 1.8;
      min-height: 52px;
      margin: 5px 0 10px;
    }

    .product-description {
      font-size: 12px;
      color: var(--muted);
      min-height: 42px;
      margin-bottom: 10px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .product-price {
      font-weight: 900;
      color: var(--green);
      font-size: 14px;
    }

    .product-price small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    .add-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 13px;
      background: var(--orange);
      color: white;
      font-size: 24px;
      font-weight: 500;
    }

    .add-button:hover {
      background: var(--orange-dark);
    }

    .empty-message {
      display: none;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    .promo {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      background: var(--green);
      color: white;
      padding: 30px 35px;
      border-radius: 25px;
      overflow: hidden;
    }

    .promo h2 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .promo p {
      font-size: 14px;
      color: #e2e9df;
    }

    .promo .button-primary {
      background: white;
      color: var(--green);
      white-space: nowrap;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
    }

    .about-image {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 26px;
    }

    .about-content h2 {
      font-size: 30px;
      color: var(--green);
      margin-bottom: 15px;
    }

    .about-content p {
      color: var(--muted);
      margin-bottom: 15px;
      font-size: 14px;
    }

    .about-points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .about-points div {
      padding: 12px;
      border-radius: 14px;
      background: white;
      font-size: 13px;
      font-weight: 700;
    }

    .faq-list {
      display: grid;
      gap: 12px;
      max-width: 850px;
      margin: auto;
    }

    .faq-list details {
      background: white;
      border: 1px solid var(--border);
      padding: 17px 20px;
      border-radius: 15px;
    }

    .faq-list summary {
      cursor: pointer;
      font-weight: 800;
      color: var(--green);
    }

    .faq-list details p {
      padding-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 30px;
      background: #243e30;
      color: white;
      padding: 45px 0 20px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 35px;
    }

    .footer-grid h3 {
      margin-bottom: 15px;
      font-size: 17px;
    }

    .footer-grid p, .footer-grid a {
      color: #d7e0d6;
      font-size: 13px;
    }

    .footer-links {
      display: grid;
      gap: 7px;
    }

    .footer-bottom {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.15);
      text-align: center;
      font-size: 11px;
      color: #d7e0d6;
    }

    .floating-whatsapp {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 90;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      background: #25d366;
      color: white;
      font-size: 27px;
      border-radius: 50%;
      box-shadow: 0 6px 22px rgba(0,0,0,.18);
    }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 50%;
      transform: translate(50%, 120px);
      opacity: 0;
      z-index: 300;
      background: var(--green);
      color: white;
      padding: 12px 22px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      transition: .3s;
      font-size: 13px;
    }

    .toast.show {
      transform: translate(50%, 0);
      opacity: 1;
    }

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 199;
      display: none;
    }

    .cart-overlay.open {
      display: block;
    }

    .cart-panel {
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: min(420px, 100%);
      height: 100dvh;
      background: var(--cream);
      transform: translateX(-105%);
      transition: transform .3s;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(0,0,0,.12);
    }

    .cart-panel.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .cart-header h2 {
      color: var(--green);
      font-size: 20px;
    }

    .close-cart {
      border: 0;
      background: white;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      font-size: 22px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-empty {
      text-align: center;
      padding: 45px 15px;
      color: var(--muted);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 65px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 13px;
    }

    .cart-item h4 {
      font-size: 13px;
    }

    .cart-item small {
      color: var(--green);
      font-weight: 800;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }

    .quantity-control button {
      width: 27px;
      height: 27px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .remove-item {
      border: 0;
      background: transparent;
      color: #c34b3b;
      font-size: 11px;
    }

    .cart-footer {
      border-top: 1px solid var(--border);
      padding: 18px;
      background: white;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      color: var(--green);
      margin-bottom: 15px;
    }

    .checkout-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #25a75a;
      color: white;
      font-weight: 800;
      padding: 13px;
    }

    .checkout-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .nav-links {
        gap: 13px;
        font-size: 12px;
      }

      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .trust-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero-content {
        padding: 28px;
      }

      .hero-card {
        min-height: 380px;
      }

      .hero-image {
        min-height: 330px;
      }
    }

    @media (max-width: 650px) {
      .navbar {
        min-height: 68px;
        flex-wrap: wrap;
        gap: 8px;
        padding: 9px 0;
      }

      .logo {
        font-size: 23px;
      }

      .logo-icon {
        width: 38px;
        height: 38px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: space-between;
        gap: 8px;
        overflow-x: auto;
        padding: 3px 0 5px;
      }

      .nav-links a {
        white-space: nowrap;
      }

      .cart-button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .hero {
        padding-top: 22px;
      }

      .hero-card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero-content {
        padding: 28px 23px 18px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 13px;
      }

      .hero-image {
        min-height: 220px;
        height: 220px;
        border-radius: 100px 0 0 0;
      }

      .trust-row {
        gap: 9px;
      }

      .trust-item {
        padding: 10px;
        gap: 8px;
      }

      .trust-icon {
        width: 37px;
        height: 37px;
        font-size: 19px;
      }

      .trust-item strong {
        font-size: 11px;
      }

      .trust-item small {
        font-size: 10px;
      }

      section {
        padding: 32px 0;
      }

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .category-card img {
        height: 125px;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product-image {
        height: 155px;
      }

      .product-info {
        padding: 11px;
      }

      .product-info h3 {
        font-size: 13px;
      }

      .product-price {
        font-size: 12px;
      }

      .add-button {
        width: 36px;
        height: 36px;
      }

      .section-heading {
        align-items: start;
      }

      .promo {
        grid-template-columns: 1fr;
        padding: 25px;
      }

      .promo h2 {
        font-size: 21px;
      }

      .promo .button-primary {
        justify-self: start;
      }

      .about-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .about-image {
        height: 240px;
      }

      .about-content h2 {
        font-size: 25px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .floating-whatsapp {
        width: 52px;
        height: 52px;
        left: 14px;
        bottom: 14px;
      }
    }

    @media (max-width: 360px) {
      .products-grid {
        gap: 8px;
      }

      .product-info {
        padding: 9px;
      }

      .product-image {
        height: 130px;
      }

      .product-bottom {
        gap: 4px;
      }
    }
  </style>
</head>
